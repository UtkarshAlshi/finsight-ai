name: Nightly Evaluation

on:
  schedule:
    # 02:00 UTC every day
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      max_questions:
        description: "Number of eval questions to run (default: all)"
        required: false
        default: "10"

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finsight
          POSTGRES_PASSWORD: finsight
          POSTGRES_DB: finsight
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run evaluation harness
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POSTGRES_DSN: postgresql+asyncpg://finsight:finsight@localhost:5432/finsight
          REDIS_URL: redis://localhost:6379/0
          QDRANT_URL: http://localhost:6333
        run: |
          MAX_Q="${{ github.event.inputs.max_questions || '10' }}"
          uv run python -c "
          import asyncio, json, sys
          from finsight.config import get_settings
          from finsight.eval.ragas_runner import run_eval

          async def main():
              settings = get_settings()
              summary = await run_eval(settings, max_questions=int('$MAX_Q'))
              print(json.dumps({
                  'total': summary['total'],
                  'answered': summary['answered'],
                  'faithfulness': summary['avg_faithfulness'],
                  'relevancy': summary['avg_answer_relevancy'],
              }, indent=2))
              # Fail if answer rate < 50%
              if summary['answered'] / summary['total'] < 0.5:
                  sys.exit(1)

          asyncio.run(main())
          "

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: src/finsight/eval/results/
          retention-days: 30
