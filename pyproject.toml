[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finsight-ai"
version = "0.1.0"
description = "Multi-agent financial intelligence platform"
requires-python = ">=3.11,<3.12"
dependencies = [
    # API
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "httpx==0.27.2",
    "sse-starlette==2.1.3",
    "python-multipart==0.0.12",

    # Config
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",

    # LLM clients
    "anthropic==0.39.0",
    "openai==1.55.3",
    "tiktoken==0.8.0",

    # Agent framework
    "langgraph==0.2.56",
    "langchain-core==0.3.21",

    # Embeddings + ML
    "sentence-transformers==3.3.1",
    "torch==2.5.1",
    "transformers==4.46.3",
    "scikit-learn==1.5.2",
    "prophet==1.1.6",
    "numpy==1.26.4",
    "pandas==2.2.3",

    # Vector DB
    "qdrant-client==1.12.1",

    # Postgres
    "asyncpg==0.30.0",
    "sqlalchemy[asyncio]==2.0.36",
    "psycopg2-binary==2.9.10",
    "alembic==1.14.0",

    # Redis
    "redis[hiredis]==5.2.1",

    # Kafka
    "aiokafka==0.11.0",

    # HTTP / retries
    "tenacity==9.0.0",
    "circuitbreaker==2.0.0",
    "aiohttp==3.11.9",

    # SEC / finance data
    "yfinance==0.2.48",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "requests==2.32.3",

    # Observability
    "structlog==24.4.0",
    "langfuse==2.57.4",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "prometheus-client==0.21.1",

    # Eval
    "ragas==0.2.8",

    # Utilities
    "python-jose==3.3.0",
    "passlib==1.7.4",
    "rich==13.9.4",
    "typer==0.13.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "pytest-httpx==0.32.0",
    "vcrpy==6.0.2",
    "ruff==0.8.1",
    "mypy==1.13.0",
    "pre-commit==4.0.1",
    "types-requests==2.32.0.20241016",
    "types-beautifulsoup4==4.12.0.20241020",
    "types-redis==4.6.0.20241004",
    "types-passlib==1.7.7.20240819",
    "httpx==0.27.2",
    "factory-boy==3.3.1",
    "faker==33.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finsight"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "TCH", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"scripts/**" = ["ANN", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
explicit_package_bases = true
exclude = ["tests/", "notebooks/", "airflow/", "scripts/", "deploy/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "eval: marks tests as evaluation tests",
]

[tool.uv]
environments = ["platform_python_implementation == 'CPython'"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
